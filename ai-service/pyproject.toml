[project]
name = "ai-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jatin", email = "jatinkumarkoushal2007@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-community<0.4",
    "langchain-core>=1.7.3",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "pandas>=3.1.1",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "ragas==0.4.3",
    "rapidfuzz>=3.14.6",
    "redis>=5.0",
    "redis-cli>=1.0.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-service = "ai_service:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
